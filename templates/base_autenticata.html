
{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/area_autenticata.css' %}?v=21">

<header class="navbar">

    <!-- LOGO -->

    <a href="{% url 'home' %}" class="navbar-logo">

        <span class="navbar-logo-simbolo" aria-hidden="true">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
            </svg>
        </span>

        <span>FuoriRete</span>

    </a>

    <!-- COLLEGAMENTI -->

    <nav class="navbar-links" aria-label="Navigazione principale">

        <a
            href="{% url 'home' %}"
            class="{% if request.resolver_match.url_name == 'home' %}attivo{% endif %}"
        >
            Home
        </a>

        <a
            href="{% url 'persone' %}"
            class="{% if request.resolver_match.url_name == 'persone' %}attivo{% endif %}"
        >
            Persone
        </a>

        <a
            href="{% url 'community' %}"
            class="{% if request.resolver_match.url_name == 'community' %}attivo{% endif %}"
        >
            Community
        </a>

    </nav>

    <!-- AZIONI A DESTRA -->

    <div class="navbar-azioni">

        <!-- NOTIFICHE NON LETTE -->

        {% if navbar_notifiche_non_lette > 0 %}

            <a
                href="{% url 'notifiche' %}"
                class="navbar-notifiche"
                aria-label="{{ navbar_notifiche_non_lette }} notifiche non lette"
                title="Hai nuove notifiche"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                    <path d="M10 21h4"/>
                </svg>

                <span class="navbar-notifiche-indicatore"></span>

            </a>

        {% endif %}

        <!-- PROFILO -->

        <a
            href="{% url 'profilo' %}"
            class="navbar-profilo {% if request.resolver_match.url_name == 'profilo' %}attivo{% endif %}"
            aria-label="Il mio profilo"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="8" r="4"/>
                <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2Z"/>
            </svg>
        </a>

    </div>

</header>

<main class="area-contenuto">

    {% block area_content %}
    {% endblock %}

</main>

{% endblock %}
